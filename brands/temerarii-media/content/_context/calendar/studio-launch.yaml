      Wed:
        email: 'Who this is for: growth-stage brands that want a builder with range, not a vendor with one trick.'
        email_subject: Who the studio is for
        email_preheader: Growth-stage brands that want range, not a vendor with one trick.
        email_body: 'Not every brand should work with us, so here is who Temerarii is built for.


          We are for growth-stage brands that want a builder with range: creative,

          performance, data, and the development to actually ship it, under one roof. If

          you have outgrown the single-channel specialist but cannot staff eight of them,

          that is the position the studio is designed for.


          We are a neutral builder. There is no ad business pulling your strategy sideways

          and no walled garden we need to defend, so the recommendation you get is the one

          the numbers support. The studio runs generative media, 3D, agents, and a content

          engine end to end, in one house. Range is the point, and few independents can

          show all of it actually running. We can, and this campaign is the proof.


          If your last agency talked more than it shipped, that is the gap we opened to

          close. Tomorrow: the proof run starts, on ourselves first.

          '
