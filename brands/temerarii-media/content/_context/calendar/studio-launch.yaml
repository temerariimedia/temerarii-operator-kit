        - We are pragmatic before we are clever. The point is the number at the end, not the demo.
        - Open does not mean loud. It means you can see the work and judge it on the receipts.
        - 'Question for founders: which pillar is your bottleneck right now, performance or attention?'
      Tue:
        email: 'What the studio is not: no retainers for slideware, no AI theater, no promises we cannot quantify.'
        email_subject: What Temerarii is not
        email_preheader: No retainers for slideware, no AI theater, no number we cannot show.
        email_body: 'It is easy to say what a studio does. It is more useful to say what it refuses

          to do, because that is where the bill usually hides.


          We will not bill you a retainer for slideware. We will not perform excitement in

          a meeting and call it strategy. We will not promise a result we cannot attach a

          number to, and we will not run the kind of AI demo that dazzles and ships

          nothing you can measure.


          An agency sells you hours. A studio ships you outcomes. We chose the second

          model on purpose, because hours reward activity and outcomes reward results. We

          would rather explain the mechanism so plainly that you could repeat it without

          us than keep the method behind a curtain.


          So here is the open-studio offer in plain terms: you brief the outcome, we show

          the path and the cost. Reply PARTNER and we will send the one-page on how we

          work.

          '
