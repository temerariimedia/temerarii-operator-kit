      brand_rails: We do not claim to be the only ones doing this, and we name no result we cannot show later. No superlatives, no performed excitement, no implied guarantees. Confidence reads quieter than hype.
      visual_treatment: Dark ground (#0A0A0C) with the red accent (#EC1C24) used once per frame, held under the 8% cap. Tahoma Bold display lockups, Tahoma Regular body, JetBrains Mono labels. Studio doors opening as the recurring motif, shot plain, no stock gloss.
      vo_music: Calm, even narration over a low, steady pulse. Music sits under the voice and never spikes.
