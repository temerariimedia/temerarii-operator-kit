      Mon:
        email: 'Why we opened: the mid-market is priced out of tools built for the Fortune 100. We are not.'
        email_subject: Why we opened the studio
        email_preheader: The good tools are priced for the giants. We built for the brands they ignore.
        email_body: 'A quick note on why Temerarii exists, because the why shapes everything we ship.


          The best go-to-market tooling is priced and packaged for the Fortune 100. If you

          run a growth-stage brand, you get the leftovers: software you outgrow in a

          quarter, or enterprise contracts you cannot justify. That gap is the reason we

          built the studio the way we did.


          So we made one house with eight service pillars instead of five vendors you have

          to chase and stitch together. You brief the outcome once. Performance, brand,

          multimedia, social, relations, development, training, and emerging tech all read

          from the same brief, so nothing falls between the seams, because there are no

          seams.


          We are pragmatic before we are clever. The point is the number at the end, not

          the demo in the middle. Tomorrow: what we will not do, stated plainly.

          '
