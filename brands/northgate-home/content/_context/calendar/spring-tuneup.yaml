  10:
    name: "Open the spring tune-up window: book the visit while we can still offer a choice of times, not the first slot left."
    tagline: Book the tune-up before the first hot week
    blog: "What a spring tune-up actually includes (and what it doesn't)"
    blog_body: |-
      Every spring we get the same question, usually from someone who just got a postcard from a competitor: what am I actually paying for with a tune-up? Fair question. Here is the whole list, in the order the technician does it.

      ## What the visit includes

      A tune-up is about 60 to 75 minutes. The technician checks refrigerant charge against the manufacturer's spec, cleans the outdoor coil, tests the capacitor and contactor under load, measures the temperature split across the evaporator, checks static pressure in the ducts, clears the condensate drain, and replaces the filter if you have one on hand.

      Then you get a written report. It lists what was measured, what the spec is, and where your system sits against it. If everything reads normal, the report says so and we leave.

      ## What it does not include

      It is not a repair. If the technician finds a failing part, they will show you the reading, tell you what the part costs and what happens if you wait, and let you decide. Nothing gets replaced without your approval and a number in front of you.

      It also does not make an old system new. A tune-up on a 19-year-old condenser buys you a cleaner coil and an honest assessment. It does not buy you five more years, and anyone who tells you otherwise is selling something.

      ## Why we push it in May

      Not because your system will fail without it. Because in May we can give you a two-hour window on a day you pick. In late July, when every no-cooling call in the metro lands on the same afternoon, we are scheduling maintenance three weeks out. The work is identical. The scheduling is not.

      ## What it costs

      $129 for a single system, $99 each for a second. Maintenance plan members pay nothing — the two seasonal visits are the plan.

      If your system is under five years old and you have had it serviced in the last twelve months, you can probably skip this year. We will tell you that on the phone before you book.
