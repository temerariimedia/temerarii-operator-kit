        email_body: "When a replacement is genuinely the right call, you get three options at three price points, what the utility rebate is worth on each, and the efficiency difference in operating cost rather than in marketing terms. Then you get time. A replacement is not an emergency purchase unless you have no heat in February, and even then there are portable options that buy you a weekend to decide properly."
