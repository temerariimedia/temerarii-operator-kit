        email: "A wear item is not the same as a symptom."
        email_subject: "Capacitor vs. coil"
        email_preheader: "One is routine. The other usually means more is coming."
        email_body: "A failed capacitor is a wear item — they die on a schedule, they are inexpensive, and replacing one on a healthy system is ordinary maintenance. A leaking evaporator coil on a system past fifteen years is usually a symptom, and the honest answer is that more is likely coming behind it. Same repair visit, completely different conversation. Ask which one you have."
        social:
          - "A failed capacitor is a wear item. They die on a schedule and they are cheap."
          - "A leaking evaporator coil on an older system is usually a symptom, not an incident."
          - "Same visit, different conversation. Ask which one you are dealing with."
          - "Routine parts fail routinely. That is not a sign your system is finished."
          - "The question is never just what broke. It is whether what broke tells you something."
      Tue:
        email: "What the utility rebate is actually worth this year."
        email_subject: "Rebates, in real numbers"
        email_preheader: "What the utility pays, and what it doesn't."
        email_body: "If replacement is the right call, the utility rebate is worth checking before you sign anything. This year it covers a meaningful share of a qualifying high-efficiency system, and it is paid by the utility, not by us — we just file the paperwork. The rebate amount and eligibility are published on the utility's own site, so verify it there rather than taking a contractor's number for it. Any company quoting you a rebate should be able to point you at the source."
