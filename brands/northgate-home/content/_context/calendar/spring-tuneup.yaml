      Sat:
        email: "The one maintenance task worth doing yourself."
        email_subject: "Clear the condensate line"
        email_preheader: "Five minutes, and it prevents the most common summer call."
        email_body: "The most common summer service call we run is not a failed compressor. It is a clogged condensate drain backing up and tripping the float switch, which shuts the system off. You can clear it yourself: find the PVC line near the indoor unit, pull the cap, and pour a cup of distilled vinegar down it every couple of months. That is the whole job. If the system still will not run after the line is clear, then it is worth a call."
