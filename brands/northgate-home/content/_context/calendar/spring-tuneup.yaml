  11:
    name: "Turn the published checklist into booked appointments: one visit, a written report, and a straight answer on whether anything is needed at all."
    tagline: One visit, a written report, a straight answer
    blog: "Repair or replace: the number that decides it"
    blog_body: |-
      At some point every homeowner gets told their system should be replaced. Here is the arithmetic we use, so you can run it yourself and check anyone's recommendation, including ours.

      ## The rule we actually use

      Take the repair quote. Multiply the system's age in years by the repair cost. If that number is comfortably above the cost of a replacement, replacement is the better spend. If it is well below, repair it and keep going. It is a rough rule, but it is a real one, and it does not depend on how anyone feels about the equipment.

      A $400 repair on an 8-year-old system gives you 3,200 against maybe 7,000 for a replacement. Repair it. That same $400 repair on a 19-year-old system gives you 7,600. Now the conversation is genuinely open.

      ## What the rule leaves out

      Two things. First, whether the failed part is a one-off or a symptom — a failed capacitor is a wear item, while a leaking evaporator coil on an older system usually means more is coming. Second, what you are paying every month to run it. A system operating well below its rated efficiency can cost enough over a summer to change the math on its own.

      Ask which of the two you are dealing with. Any technician should be able to answer without hesitating.

      ## What we will not do

      We will not quote a replacement because of the year on the label, and we will not use a repair visit as a lead-in to a sales pitch. If the number says repair, we repair it, and you will hear from us again in the fall for a tune-up rather than a proposal.

      ## If the number says replace

      Then we will give you three options at three price points, tell you what the utility rebate is worth this year, and let you sit with it. A replacement is not an emergency purchase unless you have no heat in February, and even then there are portable options that buy you a weekend to decide.
    description:
